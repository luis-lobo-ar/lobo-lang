[package]
name = "lobo-lang"
version = "1.9.0"
edition = "2021"
description = "Lobo Core native compiler and reference evaluator"
publish = false
repository = "https://github.com/luis-lobo-ar/lobo-lang"
default-run = "lobo"

[lib]
name = "lobo_core"
path = "src/lib.rs"

[[bin]]
name = "lobo"
path = "src/main.rs"

[[bench]]
name = "compare"
path = "benchmarks/compare.rs"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
overflow-checks = true

[profile.bench]
opt-level = 3

